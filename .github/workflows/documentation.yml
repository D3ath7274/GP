name: Documentation sync
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  offline-qualification:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r Controller/requirements-home.txt
      - name: Run offline tests with failure annotations
        run: |
          python - <<'PY'
          import sys
          import unittest
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests'))
          for test, traceback in result.errors + result.failures:
              message = (str(test) + '\n' + traceback).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Offline qualification failure::' + message, flush=True)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - run: python scripts/check_feature_catalog.py
      - run: python scripts/build_ai_handoff.py
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check documentation record
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/check_docs_sync.py --base "$BASE_SHA"
          else
            if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA=$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)
            fi
            python3 scripts/check_docs_sync.py --from "$BASE_SHA"
          fi
      - name: Check source-mapped feature rationale
        run: python3 scripts/check_feature_catalog.py
      - name: Check AI handbook source and file coverage
        run: python3 scripts/build_ai_handoff.py
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global mint@4.2.1195
      - name: Check documentation launcher
        run: node --test tests/test_docs_launcher.cjs
      - name: Validate documentation and links
        working-directory: docs-site
        run: |
          mint validate
          mint broken-links
          mint a11y
